# Push a tag equal to the version in manifest.json (e.g. "0.8.1", no "v") to create a draft release
# with the files Obsidian installs: main.js, manifest.json and styles.css.
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  # Signed build provenance for the release files (GitHub artifact attestations).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            main.js manifest.json styles.css
